# CI for djvudec — host build, amalgamation, full pixel-oracle tests against
# DjVuLibre on Windows, Linux, and macOS, plus fuzz crash regression and WASM.
#
# `bun cmd/tests.ts -all` needs the deps tree (DjVuLibre oracle + corpus).
# deps/ is cached per OS so cold runs pay the clone/build cost once.
# Under CI, tests.ts skips known DjVuLibre oracle quirks that are not
# decoder bugs: 1998_compression.djvu (fg-stencil on p19) and
# nasa001C.orig.png.djvu (ddjvu cannot decode this standalone PM44).
# Local -all still reports both.
#
# The host jobs also run the quick regression tests tests.ts does not cover
# (djvu_test -verify-into, cmd/test-abort.ts, cmd/test-oversize-iw44.ts,
# cmd/test-cache-race.ts) and verify the amalgamation compiles
# (`build-dist.ts -no-wasm`); only the wasm job builds WASM.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-msvc:
    name: Windows MSVC + tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            ref_build
          key: deps-v1-windows-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-windows-
      - name: Clone deps
        run: bun cmd/get-deps.ts
      - name: Oracle tests (MSVC)
        run: bun cmd/tests.ts -all
      # Quick regression tests (seconds each) that tests.ts does not cover.
      # djvu_test_msvc.exe was just built by the oracle step.
      # One exe per step: a pwsh step only reports the LAST command's exit code.
      - name: render_into == render, color (MSVC)
        run: .\out\msvc\djvu_test_msvc.exe -verify-into deps/artifacts/test001C.djvu
      - name: render_into == render, bitonal (MSVC)
        run: .\out\msvc\djvu_test_msvc.exe -verify-into deps/DjVuLibre/doc/djvu2spec.djvu
      - name: Abort API (MSVC)
        run: bun cmd/test-abort.ts deps/artifacts/test001C.djvu deps/DjVuLibre/doc/djvu2spec.djvu
      - name: Oversize IW44 dimensions (MSVC)
        run: bun cmd/test-oversize-iw44.ts
      - name: Page-cache drop vs render race (MSVC)
        run: bun cmd/test-cache-race.ts -no-asan -secs 5 deps/artifacts/test001C.djvu
      # Generates dist/djvu.{h,c} and compiles them (clang + cl). No WASM here:
      # the wasm job builds and smoke-tests that.
      - name: Amalgamation
        run: bun cmd/build-dist.ts -no-wasm

  windows-clang-fuzz:
    name: Windows clang ASan crash regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (clang from VS)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Replay tracked fuzz crashes under ASan
        run: bun cmd/fuzz.ts -check-crashes

  linux:
    name: Linux clang + tests + crashes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          # clang/clang++ for harness + DjVuLibre oracle; matching libFuzzer for crash replay
          sudo apt-get install -y clang
          major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libfuzzer-${major}-dev" || \
            sudo apt-get install -y "libclang-rt-${major}-dev" || true
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            ref_build
          key: deps-v1-linux-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-linux-
      - name: Clone deps
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        run: bun cmd/tests.ts -all -clang
      # Quick regression tests (seconds each) that tests.ts does not cover.
      # djvu_test_clang was just built by the oracle step.
      - name: render_into == render (clang)
        run: |
          out/clang/djvu_test_clang -verify-into deps/artifacts/test001C.djvu
          out/clang/djvu_test_clang -verify-into deps/DjVuLibre/doc/djvu2spec.djvu
      - name: Abort API (clang)
        run: bun cmd/test-abort.ts -clang deps/artifacts/test001C.djvu deps/DjVuLibre/doc/djvu2spec.djvu
      - name: Oversize IW44 dimensions (clang + ASan)
        run: bun cmd/test-oversize-iw44.ts -asan
      - name: Page-cache drop vs render race (clang + ASan)
        run: bun cmd/test-cache-race.ts -secs 5 deps/artifacts/test001C.djvu
      # Generates dist/djvu.{h,c} and compiles them. No WASM here: the wasm job
      # builds and smoke-tests that.
      - name: Amalgamation
        run: bun cmd/build-dist.ts -no-wasm
      - name: Fuzz crashes (ASan + UBSan)
        env:
          DJVU_FUZZ_UBSAN: "1"
        run: bun cmd/fuzz.ts -check-crashes

  macos:
    name: macOS clang + tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            ref_build
          key: deps-v1-macos-${{ hashFiles('cmd/get-deps.ts', 'cmd/build.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-macos-
      - name: Clone deps
        run: bun cmd/get-deps.ts
      - name: Oracle tests (clang)
        # Apple clang is on the runner; -clang is the default off Windows but
        # keep it explicit so this job stays parallel to linux.
        run: bun cmd/tests.ts -all -clang
      - name: Abort API (clang)
        run: bun cmd/test-abort.ts -clang deps/artifacts/test001C.djvu deps/DjVuLibre/doc/djvu2spec.djvu
      - name: Oversize IW44 dimensions (clang)
        run: bun cmd/test-oversize-iw44.ts
      # Generates dist/djvu.{h,c} and compiles them. No WASM here: the wasm job
      # builds and smoke-tests that.
      - name: Amalgamation
        run: bun cmd/build-dist.ts -no-wasm

  wasm:
    name: WASM decode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      # No fallback to the linux job's deps-v1-linux- cache: that one is saved
      # with a different path list (deps + ref_build), and actions/cache only
      # matches caches whose path list is identical.
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-v1-linux-wasm-${{ hashFiles('cmd/get-deps.ts', 'cmd/build-wasm.ts') }}
          restore-keys: |
            deps-v1-linux-wasm-
      - name: Clone deps (corpus)
        run: bun cmd/get-deps.ts
      - name: Build amalgamation + WASM
        run: bun cmd/build-dist.ts
      - name: Verify WASM decode
        run: bun cmd/verify-wasm.ts deps/artifacts/test001C.djvu
